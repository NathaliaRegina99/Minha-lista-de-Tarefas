<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Organize suas tarefas diárias de forma simples e prática.">
    <title>Minha Lista de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="container py-4">
            <p class="mb-1 header-eyebrow">Organização do dia a dia</p>
            <h1 class="h2 mb-0">Minha Lista de Tarefas</h1>
        </div>
    </header>

    <main class="container app-content py-4 py-md-5">
        <div class="row g-4">
            <section class="col-12 col-lg-4" aria-labelledby="form-title">
                <div class="card app-card">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-1" id="form-title">Nova tarefa</h2>
                        <p class="text-secondary mb-4">Sua lista está vazia. Cadastre uma tarefa para começar.</p>

                        <form id="taskForm">
                            <div class="mb-3">
                                <label for="title" class="form-label">Título</label>
                                <input type="text"
                                       class="form-control"
                                       id="title"
                                       name="title"
                                       maxlength="120"
                                       placeholder="Ex.: Preparar apresentação"
                                       required>
                                <div class="invalid-feedback">Informe o título da tarefa.</div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Descrição <span class="text-secondary">(opcional)</span></label>
                                <textarea class="form-control"
                                          id="description"
                                          name="description"
                                          rows="3"
                                          maxlength="500"
                                          placeholder="Adicione mais detalhes, se necessário."></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="priority" class="form-label">Prioridade</label>
                                <select class="form-select" id="priority" name="priority" required>
                                    <option value="" selected disabled>Selecione a prioridade</option>
                                    <option value="Baixa">Baixa</option>
                                    <option value="Média">Média</option>
                                    <option value="Alta">Alta</option>
                                </select>
                                <div class="invalid-feedback">Selecione uma prioridade válida.</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Adicionar tarefa</button>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-12 col-lg-8" aria-labelledby="tasks-title">
                <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
                    <div>
                        <h2 class="h4 mb-1" id="tasks-title">Suas tarefas</h2>
                        <p class="text-secondary mb-0">As tarefas ficam salvas neste navegador.</p>
                    </div>
                    <span class="task-count" id="taskCount" aria-live="polite">0 tarefas</span>
                </div>

                <div id="storageMessage" class="alert alert-warning d-none" role="status"></div>
                <div id="taskList" class="row g-3" aria-live="polite"></div>
            </section>
        </div>
    </main>
</body>
</html>
